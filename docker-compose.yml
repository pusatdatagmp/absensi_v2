version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: absensi_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - absensi_net

  web:
    image: nginx:alpine
    container_name: absensi_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - absensi_net

  db:
    image: mysql:8.0
    container_name: absensi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: absensi_v2_db
      MYSQL_USER: absensi_user
      MYSQL_PASSWORD: password_absensi
      MYSQL_ROOT_PASSWORD: root_absensi_pass
    volumes:
      - absensi_db_data:/var/lib/mysql
    networks:
      - absensi_net

networks:
  absensi_net:
    driver: bridge

volumes:
  absensi_db_data:
